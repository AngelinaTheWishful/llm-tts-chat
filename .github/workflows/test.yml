name: Test

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff pytest bandit
          pip install -r requirements.txt

      - name: Lint with ruff
        run: ruff check app.py modules/ tests/

      - name: Security scan with bandit
        # B104: server_name="0.0.0.0" 为有意的局域网访问绑定；B311: 会话 id 用 random（非安全场景）；
        # B113: requests timeout 经 min() 传入（bandit 未识别，实为误报）
        run: bandit -r modules app.py --skip B104,B311,B113

      - name: Test with pytest
        run: pytest tests/ -v
